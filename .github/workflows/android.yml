name: SUPERME Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android export environment
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$HOME/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
export/android/force_system_user = false
export/android/shutdown_adb_on_exit = true
EOF
          test -f "$HOME/.config/godot/editor_settings-4.4.tres"
          test -f "$HOME/debug.keystore"

      - name: Validate Godot Android export configuration
        shell: bash
        run: |
          godot --headless --editor --path . --quit
          echo "Godot Android SDK: $ANDROID_HOME"
          echo "Godot Java SDK: $JAVA_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build Android APK
        shell: bash
        run: |
          rm -rf build/android
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/SUPERME-UZBEK-WORLD.apk
          test -s build/android/SUPERME-UZBEK-WORLD.apk
          ls -lh build/android/SUPERME-UZBEK-WORLD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUPERME-UZBEK-WORLD-APK
          path: build/android/SUPERME-UZBEK-WORLD.apk
          if-no-files-found: error
