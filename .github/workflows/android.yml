name: SUPERME Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.0/x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot"
          godot --headless --editor --quit

      - name: Validate project
        run: |
          godot --headless --path . --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/SUPERME-UZBEK-WORLD.apk
          test -s build/android/SUPERME-UZBEK-WORLD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUPERME-UZBEK-WORLD-APK
          path: build/android/SUPERME-UZBEK-WORLD.apk
          if-no-files-found: error
